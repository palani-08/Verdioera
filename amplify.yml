version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node.js 20.9+; use Node 22 LTS on the Amplify build image.
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Amplify only exposes environment variables at build time. Writing them to
        # .env.production makes them available to the server (enquiry API) at runtime.
        - env | grep -E '^(RESEND_|ENQUIRY_|NEXT_PUBLIC_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
