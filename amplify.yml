version: 1
frontend:
  phases:
    preBuild:
      commands: []
    build:
      commands:
        # Inject the RFQ recipient email from the Amplify env var RFQ_EMAIL
        # (falls back to Info@verdioera.com if unset). Set it under
        # App settings -> Environment variables -> edit -> Save -> Redeploy.
        - sed -i "s|__RFQ_EMAIL__|${RFQ_EMAIL:-Info@verdioera.com}|g" index.html
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []